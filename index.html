<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0608" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Boutique</title>
    <!-- Polices Google Fonts : Playfair Display (titres) + Inter (texte) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />

    <!--
      Écran de démarrage : affiché par le navigateur dès le premier instant,
      AVANT même que le JavaScript soit chargé (donc pas de page blanche).
      React le remplace tout seul dès qu'il prend la main. Ces styles sont
      volontairement ici (et pas dans index.css) pour exister immédiatement.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #0c0608;
      }
      #demarrage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 40%, #2a0f1b, #0c0608 70%);
      }
      .point-demarrage {
        width: 14px;
        height: 14px;
        border-radius: 9999px;
        background: #ed93b1;
        box-shadow: 0 0 34px 10px rgba(212, 83, 126, 0.55);
        animation: demarrage-pouls 1.3s ease-in-out infinite;
      }
      @keyframes demarrage-pouls {
        0%,
        100% {
          transform: scale(0.75);
          opacity: 0.55;
        }
        50% {
          transform: scale(1.3);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="demarrage"><div class="point-demarrage"></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
